services:
  schedule-of-the-valley:
    build:
      context: .
      dockerfile: Dockerfile

    image: schedule-of-the-valley:latest

    restart: unless-stopped

    expose:
      - "8080"

    tmpfs:
      - /tmp:size=32m,mode=1777

    read_only: true

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    pids_limit: 100
    mem_limit: 128m
    cpus: 1.0

    stop_grace_period: 10s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - proxy

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.schedule.rule=Host(`${SCHEDULE_HOST}`)"
      - "traefik.http.routers.schedule.entrypoints=websecure"
      - "traefik.http.routers.schedule.tls=true"
      - "traefik.http.routers.schedule.tls.certresolver=letsencrypt"
      - "traefik.http.routers.schedule.middlewares=secure-headers@file,rate-limit@file"
      - "traefik.http.services.schedule.loadbalancer.server.port=8080"

networks:
  proxy:
    external: true
    name: proxy