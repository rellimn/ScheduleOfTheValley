worker_processes auto;

error_log /dev/stderr warn;
pid       /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main
        '$remote_addr - $remote_user [$time_local] "$request" '
        '$status $body_bytes_sent "$http_referer" '
        '"$http_user_agent"';

    access_log /dev/stdout main;

    sendfile on;
    tcp_nopush on;

    keepalive_timeout 15;
    server_tokens off;

    # Compression for text-based assets.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    server {
        listen 8080;
        listen [::]:8080;

        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Simple endpoint usable by Traefik/Docker monitoring.
        location = /healthz {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok\n";
        }

        location / {
            try_files $uri $uri/ =404;
        }

        # Don't accidentally serve hidden files.
        location ~ /\. {
            deny all;
        }

        # Basic safe header that shouldn't interfere with most sites.
        add_header X-Content-Type-Options "nosniff" always;
    }
}